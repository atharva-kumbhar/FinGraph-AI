services:
  - type: web
    name: fingraph-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: FINGRAPH_HOST
        value: 0.0.0.0
      - key: FINGRAPH_DATASET_PATH
        value: /app/data/sp100/chunks.jsonl
      - key: FINGRAPH_INDEX_DIR
        value: /app/data/faiss_index
      - key: GEMINI_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: TG_HOST
        sync: false
      - key: TG_GRAPH_NAME
        sync: false
      - key: TG_SECRET
        sync: false
      - key: TG_API_TOKEN
        sync: false
      - key: FINGRAPH_CORS_ORIGINS
        sync: false
