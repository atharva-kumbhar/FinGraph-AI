[project]
name = "fingraph-ai"
version = "0.1.0"
description = "FinGraph AI System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "requests>=2.32.0",
    "numpy>=1.26.0",
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "pydantic>=2.0.0",
    "bert-score>=0.3.13"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
